<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cyber + AI News</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2330; --border: #2a3140;
    --text: #e6edf3; --muted: #8b949e; --accent: #4f9cff; --accent-2: #7ee787;
    --crit: #ff6b6b; --high: #ffa657; --med: #f2cc60; --low: #8b949e;
    --cyber: #4f9cff; --ai: #bc8cff; --both: #7ee787;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --panel: #ffffff; --panel-2: #f0f3f6; --border: #d0d7de;
      --text: #1f2328; --muted: #656d76; --accent: #0969da;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--text); }
  a { color: inherit; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
           border-bottom: 1px solid var(--border); background: var(--panel);
           position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; white-space: nowrap; }
  header h1 .dot { color: var(--accent); }
  nav { display: flex; gap: 4px; }
  nav button { background: transparent; border: 1px solid transparent; color: var(--muted);
               padding: 6px 14px; border-radius: 6px; font: inherit; cursor: pointer; }
  nav button.active { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  header .stats { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--border);
           background: var(--panel-2); color: var(--text); padding: 7px 12px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }

  /* ---------- Overview ---------- */
  .wrap { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .watchstrip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .wchip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px;
           background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
           font-size: 13px; cursor: pointer; }
  .wchip:hover { border-color: var(--accent); }
  .wchip .c { background: var(--panel-2); border-radius: 999px; padding: 1px 7px;
              font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wchip.alert::before { content: "🔔"; font-size: 11px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; }
  .kpi:hover { border-color: var(--accent); }
  .kpi .n { font-size: 30px; font-weight: 700; line-height: 1; }
  .kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; margin-top: 8px; }
  .kpi.crit .n { color: var(--crit); }
  .kpi.inter .n { color: var(--ai); }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
  .hl { display: block; padding: 9px 0; border-bottom: 1px solid var(--border); text-decoration: none; }
  .hl:last-child { border-bottom: none; }
  .hl .t { font-size: 14px; font-weight: 600; line-height: 1.35; }
  .hl:hover .t { color: var(--accent); }
  .hl .m { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; cursor: pointer; }
  .bar:hover .name { color: var(--accent); }
  .bar .name { width: 130px; flex-shrink: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { flex: 1; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar .v { width: 34px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sevbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 4px 0 12px; }
  .sevbar span { display: block; }
  .seglegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .seglegend b { color: var(--text); }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.dom-cyber { background: color-mix(in srgb, var(--cyber) 20%, transparent); color: var(--cyber); }
  .badge.dom-ai { background: color-mix(in srgb, var(--ai) 20%, transparent); color: var(--ai); }
  .badge.dom-both { background: color-mix(in srgb, var(--both) 20%, transparent); color: var(--both); }
  .sev { font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: .5px; }
  .sev.critical { color: var(--crit); } .sev.high { color: var(--high); }
  .sev.medium { color: var(--med); } .sev.low { color: var(--low); }

  /* ---------- Browse ---------- */
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 0; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } aside { border-right: none !important; } }
  aside { border-right: 1px solid var(--border); padding: 18px; background: var(--panel); }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 18px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .field { display: block; width: 100%; margin-bottom: 8px; }
  select, input[type=search] { width: 100%; padding: 8px 10px; border-radius: 6px;
         border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border);
          background: var(--panel-2); color: var(--muted); font-size: 12px; cursor: pointer; }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { padding: 18px 20px; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .count { color: var(--muted); font-size: 13px; }
  .acard { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 10px; position: relative; }
  .acard:hover { border-color: var(--accent); }
  .acard.read { opacity: .58; }
  .acard.read:hover { opacity: 1; }
  .acard .star { position: absolute; top: 12px; right: 12px; background: none; border: none;
                 font-size: 17px; color: var(--muted); cursor: pointer; padding: 0; line-height: 1; }
  .acard .star.on { color: var(--med); }
  .acard .title { padding-right: 26px; }
  .acard a.title { color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px; line-height: 1.35; }
  .acard a.title:hover { color: var(--accent); }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 11px; color: var(--muted); background: var(--panel-2);
         border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; cursor: pointer; }
  .tag:hover { color: var(--accent); border-color: var(--accent); }
  .summary { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  .hidden { display: none !important; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--muted);
          border-top-color: transparent; border-radius: 50%; animation: s 0.7s linear infinite; vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg); } }
  #loadMore { display: block; margin: 8px auto 30px; }
</style>
</head>
<body>
<header>
  <h1><span class="dot">●</span> Cyber<span style="color:var(--muted)">+</span>AI News</h1>
  <nav>
    <button id="navOverview" class="active">Overview</button>
    <button id="navBrowse">Browse</button>
  </nav>
  <span class="stats" id="headerStats"></span>
  <span id="healthBadge" title="source health" style="font-size:12px;cursor:pointer"></span>
  <button id="refreshBtn" class="primary">↻ Refresh feeds</button>
</header>

<!-- ============ OVERVIEW ============ -->
<section id="overview" class="wrap">
  <div id="watchStrip" class="watchstrip"></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="col">
      <div class="card"><h3>Latest</h3><div id="ovLatest"></div></div>
    </div>
    <div class="col">
      <div class="card">
        <h3>Severity</h3>
        <div class="sevbar" id="sevBar"></div>
        <div class="seglegend" id="sevLegend"></div>
      </div>
      <div class="card"><h3>By domain</h3><div id="ovDomain"></div></div>
      <div class="card"><h3>Top categories</h3><div id="ovCats"></div></div>
      <div class="card"><h3>Top sources</h3><div id="ovSources"></div></div>
    </div>
  </div>
  <div class="grid" style="margin-top:16px">
    <div class="card"><h3>⚠ Critical &amp; actively exploited</h3><div id="ovCritical"></div></div>
    <div class="card"><h3>AI × Cyber</h3><div id="ovInter"></div></div>
  </div>
</section>

<!-- ============ BROWSE ============ -->
<section id="browse" class="hidden">
  <div class="layout">
    <aside>
      <h2>Search</h2>
      <input type="search" id="search" class="field" placeholder="keyword…" />
      <h2>Domain</h2>
      <div class="chips" id="domainChips">
        <span class="chip active" data-domain="">All</span>
        <span class="chip" data-domain="cyber">Cyber</span>
        <span class="chip" data-domain="ai">AI</span>
      </div>
      <h2>Category</h2>
      <select id="category" class="field"><option value="">All categories</option></select>
      <h2>Severity</h2>
      <div class="chips" id="sevChips">
        <span class="chip active" data-sev="">Any</span>
        <span class="chip" data-sev="critical">Critical</span>
        <span class="chip" data-sev="high">High</span>
        <span class="chip" data-sev="medium">Medium</span>
        <span class="chip" data-sev="low">Low</span>
      </div>
      <h2>Region</h2>
      <select id="region" class="field">
        <option value="">Any region</option>
        <option value="us">US</option><option value="eu">EU</option>
        <option value="uk">UK</option><option value="apac">APAC</option>
      </select>
      <h2>Sort</h2>
      <select id="sort" class="field">
        <option value="date">Newest first</option>
        <option value="weight">Source weight</option>
      </select>
    </aside>
    <main>
      <div class="toolbar">
        <span class="count" id="count">Loading…</span>
        <label style="margin-left:auto;font-size:13px;color:var(--muted);cursor:pointer">
          <input type="checkbox" id="savedOnly" style="vertical-align:-1px"> ★ Saved only</label>
      </div>
      <div id="list"></div>
      <button id="loadMore" class="hidden">Load more</button>
    </main>
  </div>
</section>

<script>
const $ = (s) => document.querySelector(s);
const state = { domain: "", category: "", severity: "", region: "", q: "", sort: "date", offset: 0, savedOnly: false };
let searchTimer = null, browseLoaded = false;

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// Only allow http(s) links — a hostile feed must not inject javascript:/data: URLs.
function safeUrl(u) {
  return (typeof u === "string" && /^https?:\/\//i.test(u)) ? escapeHtml(u) : "#";
}
function fmtDate(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso), now = new Date();
    const mins = Math.round((now - d) / 60000);
    if (mins < 60) return mins <= 1 ? "just now" : mins + "m ago";
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    const days = Math.round(hrs / 24);
    if (days < 7) return days + "d ago";
    return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
  } catch { return iso.slice(0,10); }
}
function fullDate(iso) {
  try { return new Date(iso).toLocaleString(); } catch { return iso || ""; }
}

/* ---------- read / bookmark state (localStorage) ---------- */
const READ_KEY = "can_read", SAVE_KEY = "can_saved";
function loadSet(k) { try { return new Set(JSON.parse(localStorage.getItem(k) || "[]")); } catch { return new Set(); } }
function saveSet(k, s) { localStorage.setItem(k, JSON.stringify([...s])); }
let readSet = loadSet(READ_KEY), savedSet = loadSet(SAVE_KEY);
function markRead(id) { if (!readSet.has(id)) { readSet.add(id); saveSet(READ_KEY, readSet); } }
function toggleSaved(id) {
  if (savedSet.has(id)) savedSet.delete(id); else savedSet.add(id);
  saveSet(SAVE_KEY, savedSet);
  return savedSet.has(id);
}

/* ---------- view switching ---------- */
function show(view) {
  const ov = view === "overview";
  $("#overview").classList.toggle("hidden", !ov);
  $("#browse").classList.toggle("hidden", ov);
  $("#navOverview").classList.toggle("active", ov);
  $("#navBrowse").classList.toggle("active", !ov);
  if (!ov && !browseLoaded) { loadCategories().then(loadBrowse); browseLoaded = true; }
}
function jumpToBrowse(patch) {
  Object.assign(state, { domain:"", category:"", severity:"", region:"", q:"" }, patch, { offset: 0 });
  show("browse");
  if (!browseLoaded) { loadCategories().then(() => { syncControls(); loadBrowse(); }); browseLoaded = true; }
  else { syncControls(); loadBrowse(); }
}

/* ---------- overview ---------- */
async function loadOverview() {
  const o = await fetch("/api/overview?highlights=8").then(r => r.json());
  $("#headerStats").textContent =
    `${o.total} articles · ${o.new_last_24h} new (24h)`;

  const crit = o.critical_count ?? (o.by_severity.critical || 0);
  const inter = o.intersection_count ?? 0;
  $("#kpis").innerHTML = `
    ${kpi("", o.total, "Total articles", {})}
    ${kpi("", o.new_last_7d, "New this week", {})}
    ${kpi("crit", crit, "Critical", {severity:"critical"})}
    ${kpi("inter", inter, "AI × Cyber", {category:"intersection"})}`;
  $("#kpis").querySelectorAll(".kpi").forEach(el => {
    const f = el.dataset.filter;
    if (f) el.addEventListener("click", () => jumpToBrowse(JSON.parse(f)));
  });

  $("#ovLatest").innerHTML = o.latest.map(hl).join("") || emptyLine();
  $("#ovCritical").innerHTML = o.critical.map(hl).join("") || emptyLine("No critical items.");
  $("#ovInter").innerHTML = o.intersection.map(hl).join("") || emptyLine("No AI×Cyber items.");

  renderSeverity(o.by_severity);
  $("#ovDomain").innerHTML = bars(Object.entries(o.by_domain), o.total, k => ({domain:k}));
  $("#ovCats").innerHTML = bars(o.top_categories.filter(([k])=>k!=="uncategorized").slice(0,8),
                                o.top_categories[0]?.[1] || 1,
                                k => ({category: k.split(".").pop()}));
  $("#ovSources").innerHTML = bars(o.top_sources, o.top_sources[0]?.[1] || 1, k => ({source:k}));
}
function kpi(cls, n, label, filter) {
  return `<div class="kpi ${cls}" data-filter='${JSON.stringify(filter)}'>
    <div class="n">${n}</div><div class="l">${label}</div></div>`;
}
function hl(a) {
  const sev = a.severity ? `<span class="sev ${a.severity}">${a.severity}</span>` : "";
  return `<a class="hl" href="${safeUrl(a.url)}" target="_blank" rel="noopener">
    <div class="t">${escapeHtml(a.title)}</div>
    <div class="m"><span class="badge dom-${a.domain}">${a.domain}</span>${sev}
      <span>${escapeHtml(a.source)}</span><span>·</span><span>${fmtDate(a.published)}</span></div></a>`;
}
function emptyLine(t) { return `<div style="color:var(--muted);font-size:13px;padding:6px 0">${t||"Nothing yet."}</div>`; }
function bars(entries, max, toFilter) {
  return entries.map(([k, v]) => {
    const pct = Math.max(3, Math.round(100 * v / (max || 1)));
    const label = k.includes(".") ? k.split(".").pop() : k;
    return `<div class="bar" data-filter='${JSON.stringify(toFilter(k))}'>
      <span class="name">${escapeHtml(label)}</span>
      <span class="track"><span class="fill" style="width:${pct}%"></span></span>
      <span class="v">${v}</span></div>`;
  }).join("");
}
function renderSeverity(sev) {
  const order = [["critical","--crit"],["high","--high"],["medium","--med"],["low","--low"]];
  const total = order.reduce((s,[k]) => s + (sev[k]||0), 0) || 1;
  $("#sevBar").innerHTML = order.map(([k,c]) =>
    `<span style="width:${100*(sev[k]||0)/total}%;background:var(${c})"></span>`).join("");
  $("#sevLegend").innerHTML = order.map(([k,c]) =>
    `<span style="cursor:pointer" data-sev="${k}"><b style="color:var(${c})">${sev[k]||0}</b> ${k}</span>`).join("");
  $("#sevLegend").querySelectorAll("[data-sev]").forEach(el =>
    el.addEventListener("click", () => jumpToBrowse({severity: el.dataset.sev})));
}
// event delegation for the clickable bars
document.addEventListener("click", e => {
  const bar = e.target.closest(".bar");
  if (bar && bar.dataset.filter) jumpToBrowse(JSON.parse(bar.dataset.filter));
});

/* ---------- browse ---------- */
async function loadCategories() {
  if ($("#category").dataset.loaded) return;
  const data = await fetch("/api/categories").then(r => r.json());
  const sel = $("#category");
  for (const [domain, group] of Object.entries(data.categories || {})) {
    const og = document.createElement("optgroup"); og.label = domain.toUpperCase();
    for (const [key, spec] of Object.entries(group)) {
      const o = document.createElement("option");
      o.value = key; o.textContent = spec.label || key; og.appendChild(o);
    }
    sel.appendChild(og);
  }
  sel.dataset.loaded = "1";
}
function syncControls() {
  $("#category").value = state.category || "";
  $("#region").value = state.region || "";
  $("#sort").value = state.sort || "date";
  $("#search").value = state.q || "";
  $("#domainChips").querySelectorAll(".chip").forEach(c =>
    c.classList.toggle("active", (c.dataset.domain||"") === state.domain));
  $("#sevChips").querySelectorAll(".chip").forEach(c =>
    c.classList.toggle("active", (c.dataset.sev||"") === state.severity));
}
function acard(a) {
  const sev = a.severity ? `<span class="sev ${a.severity}">${a.severity}</span>` : "";
  const tags = (a.categories || []).map(c =>
    `<span class="tag" data-cat="${c.split('.').pop()}">${c}</span>`).join("");
  const dup = a.duplicate_of ? `<span title="near-duplicate of another item">· similar</span>` : "";
  const el = document.createElement("div");
  el.className = "acard" + (readSet.has(a.id) ? " read" : "");
  const saved = savedSet.has(a.id);
  el.innerHTML = `
    <button class="star ${saved?"on":""}" title="bookmark">${saved?"★":"☆"}</button>
    <a class="title" href="${safeUrl(a.url)}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a>
    <div class="meta"><span class="badge dom-${a.domain}">${a.domain}</span>${sev}
      <span>${escapeHtml(a.source)}</span><span>·</span>
      <span title="${fullDate(a.published)}">${fmtDate(a.published)}</span>${dup}</div>
    ${a.summary ? `<div class="summary">${escapeHtml(a.summary.slice(0,240))}${a.summary.length>240?"…":""}</div>`:""}
    <div class="tags">${tags}</div>`;
  el.querySelector(".title").addEventListener("click", () => { markRead(a.id); el.classList.add("read"); });
  el.querySelector(".star").addEventListener("click", (e) => {
    const on = toggleSaved(a.id);
    e.target.textContent = on ? "★" : "☆";
    e.target.classList.toggle("on", on);
    if (state.savedOnly && !on) el.remove();
  });
  el.querySelectorAll(".tag").forEach(t => t.addEventListener("click", () => {
    state.category = t.dataset.cat; state.offset = 0; syncControls(); loadBrowse();
  }));
  return el;
}
async function loadBrowse(append = false) {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(state)) {
    if (k === "savedOnly" || k === "offset") continue;
    if (v) p.set(k, v);
  }
  const savedOnly = state.savedOnly;
  p.set("limit", savedOnly ? "500" : "50");
  p.set("offset", savedOnly ? "0" : String(append ? state.offset : (state.offset = 0)));
  const data = await fetch("/api/articles?" + p).then(r => r.json());
  const list = $("#list");
  if (!append) list.innerHTML = "";
  let articles = data.articles;
  if (savedOnly) articles = articles.filter(a => savedSet.has(a.id));
  if (!articles.length && !append) {
    list.innerHTML = `<div class="empty">${savedOnly ? "No bookmarked items match." : "No articles match these filters."}</div>`;
  } else {
    articles.forEach(a => list.appendChild(acard(a)));
  }
  const shown = list.querySelectorAll(".acard").length;
  $("#count").textContent = savedOnly ? `${shown} bookmarked` : `${shown} of ${data.total}`;
  $("#loadMore").classList.toggle("hidden", savedOnly || shown >= data.total);
}

/* ---------- controls ---------- */
$("#navOverview").addEventListener("click", () => show("overview"));
$("#navBrowse").addEventListener("click", () => show("browse"));
$("#domainChips").addEventListener("click", e => {
  if (!e.target.classList.contains("chip")) return;
  $("#domainChips").querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  e.target.classList.add("active"); state.domain = e.target.dataset.domain; state.offset = 0; loadBrowse();
});
$("#sevChips").addEventListener("click", e => {
  if (!e.target.classList.contains("chip")) return;
  $("#sevChips").querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  e.target.classList.add("active"); state.severity = e.target.dataset.sev; state.offset = 0; loadBrowse();
});
$("#category").addEventListener("change", e => { state.category = e.target.value; state.offset = 0; loadBrowse(); });
$("#region").addEventListener("change", e => { state.region = e.target.value; state.offset = 0; loadBrowse(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; state.offset = 0; loadBrowse(); });
$("#search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = e.target.value.trim(); state.offset = 0; loadBrowse(); }, 300);
});
$("#loadMore").addEventListener("click", () => { state.offset += 50; loadBrowse(true); });
$("#savedOnly").addEventListener("change", e => { state.savedOnly = e.target.checked; state.offset = 0; loadBrowse(); });

$("#refreshBtn").addEventListener("click", async () => {
  const btn = $("#refreshBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Refreshing…';
  await fetch("/api/refresh", { method: "POST" });
  const poll = setInterval(async () => {
    const h = await fetch("/api/health").then(r => r.json());
    if (!h.refresh.running) {
      clearInterval(poll);
      btn.disabled = false; btn.innerHTML = "↻ Refresh feeds";
      await loadOverview(); loadHealth();
      if (browseLoaded && !$("#browse").classList.contains("hidden")) loadBrowse();
    }
  }, 1500);
});

async function loadWatchlists() {
  try {
    const { watchlists } = await fetch("/api/watchlists").then(r => r.json());
    const strip = $("#watchStrip");
    strip.innerHTML = watchlists.map(w =>
      `<span class="wchip ${w.alert ? "alert" : ""}" data-filter='${JSON.stringify(w.filters)}'>
         ${escapeHtml(w.label)} <span class="c">${w.count}</span></span>`).join("");
    strip.querySelectorAll(".wchip").forEach(el =>
      el.addEventListener("click", () => jumpToBrowse(JSON.parse(el.dataset.filter))));
  } catch (e) { /* ignore */ }
}

async function loadHealth() {
  try {
    const h = await fetch("/api/sources/health").then(r => r.json());
    const b = $("#healthBadge");
    if (!h.sources.length) { b.textContent = ""; return; }
    if (h.problem_count === 0) {
      b.textContent = "● sources ok";
      b.style.color = "var(--accent-2)";
      b.title = `${h.sources.length} sources healthy`;
    } else {
      const fail = h.failing.length;
      b.textContent = `⚠ ${h.problem_count} source${h.problem_count>1?"s":""}`;
      b.style.color = fail ? "var(--crit)" : "var(--high)";
      b.title = (fail ? "Failing: " + h.failing.join(", ") + "\n" : "")
              + (h.empty.length ? "Empty: " + h.empty.join(", ") : "");
    }
    b.onclick = () => alert(b.title || "All sources healthy");
  } catch (e) { /* ignore */ }
}

/* ---------- init ---------- */
loadOverview();
loadWatchlists();
loadHealth();
</script>
</body>
</html>

# Two deployment modes:
#
#   With Caddy (default) — Caddy handles TLS + basic auth; the app is internal-only.
#     Set BASIC_AUTH_USER + BASIC_AUTH_HASH (bcrypt) in .env. Leave AUTH_USER/AUTH_PASS blank.
#     docker compose up -d
#
#   Without Caddy — remove or comment out the caddy service below, then publish the
#     app's port directly and set AUTH_USER + AUTH_PASS in .env for built-in basic auth.
#     docker compose up -d news

services:
  news:
    build: .
    image: cyber-ai-news:latest
    # When running with Caddy: keep expose only (caddy proxies; app is internal).
    # When running without Caddy: change to ports: ["8000:8000"] and remove caddy below.
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist the SQLite history across container restarts.
      - news-data:/app/data
      # Edit config on the host without rebuilding; restart to pick up changes.
      - ./config:/app/config:ro
    # ---- hardening ----
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

  # Optional reverse proxy with TLS + basic auth.
  # Remove this service (and change expose → ports on news above) to run without it.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - news
    ports:
      # Plain HTTP on 8080 by default. For HTTPS with a domain, also publish
      # "80:80" and "443:443" and set SITE_ADDRESS to your hostname in .env.
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  news-data:
  caddy-data:
  caddy-config:

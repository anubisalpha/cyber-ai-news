    domain: releases
    enabled: true
    weight: 3
    product_url: https://github.com/glpi-project/glpi/releases

  # Applications
  - name: GitLab Releases
    type: rss
    url: https://about.gitlab.com/blog/categories/releases/feed.xml
    domain: releases
    enabled: true
    weight: 4
    product_url: https://about.gitlab.com/releases/

  - name: DokuWiki Releases
    type: rss
    url: https://github.com/dokuwiki/dokuwiki/releases.atom
    domain: releases
    enabled: true
    weight: 3
    product_url: https://www.dokuwiki.org/changes

  - name: Eramba Releases
    type: rss
    url: https://github.com/eramba/eramba/releases.atom
    domain: releases
    enabled: false          # private repo — no public releases feed
    weight: 3
    product_url: https://eramba.org/

  # Developer tooling
  - name: JetBrains Blog
    type: rss
    url: https://blog.jetbrains.com/feed/
    domain: releases
    enabled: true

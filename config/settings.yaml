# General runtime settings for the news service.

fetch:
  timeout_seconds: 20
  user_agent: "cyber-ai-news/0.1 (+https://github.com/anubisalpha)"
  max_items_per_source: 50
  # Ignore incoming items whose PUBLISH date is older than this many days.
  # 0 = ingest whatever the feeds return (keeps history unlimited).
  max_age_days: 0

classify:
  # Fields searched for keyword matches, in priority order.
  search_fields: [title, summary]
  # An article with zero category matches gets this tag instead of being dropped.
  fallback_category: uncategorized
  min_keyword_length: 3

  # Optional LLM pass over ONLY the items the keyword rules leave uncategorized.
  # Uses google-generativeai + GOOGLE_API_KEY (from env or the claudecore .env).
  # Off by default; a no-op if the library/key are missing.
  llm_fallback:
    enabled: false
    model: gemini-3.6-flash
    batch_size: 10
    max_items: 40          # cap per refresh to bound cost

# Near-duplicate detection: cluster the same story across outlets.
dedupe:
  enabled: true
  title_similarity: 0.7      # Jaccard threshold on title tokens (0-1)
  cross_source_only: true    # only merge across DIFFERENT outlets (avoids templated-title false merges)
  max_days_apart: 3          # only cluster items published within this many days

storage:
  # SQLite database (unlimited history scales here; JSON is import/export only).
  db_file: data/news.db
  # Legacy JSON cache — imported once into SQLite on first run if present.
  data_file: data/articles.json
  # History retention. 0 = unlimited (keep every fetch forever).
  # Set to a number of days to trim fetches first seen longer ago than that
  # on each refresh (e.g. 90 keeps the last ~3 months of history).
  history_retention_days: 0

output:
  # Default sort for CLI/API listings: "date" or "weight".
  default_sort: date
  default_limit: 25

# Scheduled auto-refresh. Runs in-process when the API starts (if enabled),
# or standalone via `python -m src.scheduler`.
schedule:
  enabled: false
  refresh_on_start: false

  # Hourly refresh during working hours (Mon–Fri only).
  working_hours:
    enabled: true
    days: [mon, tue, wed, thu, fri]
    from: "08:00"
    to: "18:00"

  # Nightly sweep — runs every day at this time regardless of day.
  # Immediately followed by the critical digest if that is enabled.
  nightly_sweep:
    enabled: true
    at: "02:00"

  # Critical digest — sent right after the nightly sweep, covering the
  # 24-hour window ending at sweep time (02:00 yesterday → 02:00 today).
  # Requires Phase 4 user subscriptions; uses digest.recipient until then.
  # NOTE: enabling this sends REAL email autonomously.
  critical_digest:
    enabled: false

# Watchlist alerts — notify when NEW items match an alert-enabled watchlist
# (see config/watchlists.yaml). Checked after each refresh.
alerts:
  enabled: false
  channel: log             # "email" (via claude-mail) or "log" (print only)
  recipient: null          # null = claude-mail's DEFAULT_TO
  max_per_watchlist: 10

# Email digest (sent via the claude-mail project's send()).
digest:
  enabled: true
  recipient: null            # null = claude-mail's DEFAULT_TO
  subject: "Cyber+AI News Digest — {date}"
  window_hours: 24           # include items first seen in the last N hours (0 = all)
  max_per_section: 8
  # Each section is a named filter (severity/domain/category/region/source/q).
  sections:
    - {title: "⚠ Critical & actively exploited", severity: critical}
    - {title: "AI × Cyber", category: intersection}
    - {title: "Cybersecurity", domain: cyber}
    - {title: "AI", domain: ai}
